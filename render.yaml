# Render blueprint for the two app services. The database is external (Neon),
# so no `database` entries appear here — fill in the Neon DSN/credentials as
# env vars after creating the Neon project.
#
# Notes:
# - ai-service DATABASE_URL must be a Postgres DSN with pgvector available.
#   Use Neon's direct endpoint (not the -pooler one): this service pools
#   connections in-app via psycopg_pool.
# - backend SPRING_DATASOURCE_URL is the JDBC form of the same database.
# - Free-tier instances spin down when idle; first requests after idle are slow
#   (JVM/Python cold start + Neon cold start).
services:
  - type: web
    name: aidoc-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: dots-studio/dots-3-note-preview:free
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b:free
      - key: CHAT_REASONING_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: ai_service
      - key: VECTOR_DIM
        value: "1024"

  - type: web
    name: aidoc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AI_SERVICE_BASE_URL
        fromService:
          name: aidoc-ai-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_STORAGE_TYPE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: ai-doc-assistant
      - key: APP_GOOGLE_CLIENT_ID
        sync: false
