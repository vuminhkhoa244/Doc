spring.application.name=ai-document-assistant-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/assistant-db;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-change-this-development-secret}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:120}
app.jwt.refresh-token-days=${APP_JWT_REFRESH_TOKEN_DAYS:14}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:./data/uploads}
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:ai-doc-assistant}
app.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
app.web-search.base-url=${WEB_SEARCH_BASE_URL:http://localhost:8888}
app.web-search.timeout-seconds=${WEB_SEARCH_TIMEOUT_SECONDS:8}
app.web-search.max-results=${WEB_SEARCH_MAX_RESULTS:5}
app.ocr.enabled=${APP_OCR_ENABLED:true}
app.ocr.tessdata-dir=${APP_OCR_TESSDATA_DIR:/usr/share/tesseract-ocr/5/tessdata}
app.ocr.language=${APP_OCR_LANGUAGE:vie+eng}
app.ocr.dpi=${APP_OCR_DPI:300}
app.ocr.max-pages=${APP_OCR_MAX_PAGES:50}
app.ocr.sparse-min-chars=${APP_OCR_SPARSE_MIN_CHARS:10}
app.images.enabled=${APP_IMAGES_ENABLED:true}
app.images.min-pixel-size=${APP_IMAGES_MIN_PIXEL_SIZE:64}
app.images.max-per-document=${APP_IMAGES_MAX_PER_DOCUMENT:30}
app.google.client-id=${APP_GOOGLE_CLIENT_ID:}
