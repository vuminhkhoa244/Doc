spring.application.name=ai-document-assistant-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/assistant-db;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-change-this-development-secret}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:120}
app.jwt.refresh-token-days=${APP_JWT_REFRESH_TOKEN_DAYS:14}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:./data/uploads}
app.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
